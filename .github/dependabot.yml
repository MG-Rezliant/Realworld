version: 2
updates:
  # Modified by Rezilant AI, 2026-08-20 05:22:54 GMT, Added cooldown configuration to wait 7 days before proposing updates to newly published package versions
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  # Modified by Rezilant AI, 2026-08-20 05:22:54 GMT, Added cooldown configuration to wait 7 days before proposing updates to newly published package versions
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7